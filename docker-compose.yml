services:
  app:
    build: .
    image: avito-mvp-app:local
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - amnet

  db:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - amnet


  prometheus:
    image: prom/prometheus:latest
    container_name: avito-mvp-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - amnet

  grafana:
    image: grafana/grafana:9.5.2
    container_name: avito-mvp-grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - amnet

volumes:
  pgdata:

networks:
  amnet:
    driver: bridge
